name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.4", "4.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/mzci-bin ./cmd/mzci

      - name: Smoke test
        run: |
          tmpdir="$(mktemp -d ./.mzci-smoke.XXXXXX)"
          trap 'rm -rf "$tmpdir" .manazashi.toml' EXIT
          /tmp/mzci-bin init --db "$tmpdir/init.sqlite" .
          /tmp/mzci-bin status --db "$tmpdir/init.sqlite"
          /tmp/mzci-bin stats --db "$tmpdir/init.sqlite"
          /tmp/mzci-bin rebuild .
          /tmp/mzci-bin update .
          /tmp/mzci-bin status --root .
          /tmp/mzci-bin stats --root .
          /tmp/mzci-bin metrics --root .
